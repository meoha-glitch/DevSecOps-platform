name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier Python disponible
        run: python3 --version

      - name: Créer un environnement virtuel et installer les dépendances
        working-directory: app
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lancer les tests unitaires
        working-directory: app
        run: |
          source venv/bin/activate
          pytest -v --junitxml=test-results.xml

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/test-results.xml

      - name: Construire l'image Docker
        run: |
          docker build -t devsecops-demo-app:${{ github.sha }} -f docker/Dockerfile .

      - name: Vérifier que l'image tourne correctement
        run: |
          docker run -d --name ci-test-container -p 5001:5000 devsecops-demo-app:${{ github.sha }}
          sleep 3
          curl -f http://localhost:5001/health
          docker stop ci-test-container
          docker rm ci-test-container
  sonarqube-scan:
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Vérifier le Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  
  trivy-image-scan:
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construire l'image à scanner
        run: |
          docker build -t devsecops-demo-app:${{ github.sha }} -f docker/Dockerfile .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: devsecops-demo-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
