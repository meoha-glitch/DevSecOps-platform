apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mon-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/meoha-glitch/DevSecOps-platform.git
    targetRevision: main
    path: helm-charts/mon-app
    helm:
      valueFiles:
        - ../../gitops/dev/values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
