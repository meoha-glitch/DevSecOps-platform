replicaCount: 2

image:
  repository: ghcr.io/meoha-glitch/devsecops-demo-app
  tag: "de77d4312ca6c4d07915f6873c15b14545040561"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: dev.devsecops.local
  path: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

env:
  APP_VERSION: "dev"

healthCheck:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
