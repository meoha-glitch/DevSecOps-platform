apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mon-app
  labels:
    app: {{ .Release.Name }}-mon-app
spec:
  selector:
    app: {{ .Release.Name }}-mon-app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
